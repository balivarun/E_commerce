services:
  - type: web
    name: ecommerce-backend
    runtime: docker
    dockerfilePath: ./backend/Ecommerce/Dockerfile
    dockerContext: ./backend/Ecommerce
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
