spring.application.name=Ecommerce

# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/api

# MongoDB Configuration
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:Ecommerce}

# MongoDB connection timeout settings
spring.data.mongodb.options.connect-timeout=30000
spring.data.mongodb.options.socket-timeout=30000
spring.data.mongodb.options.server-selection-timeout=30000

# CORS Configuration - set to your Vercel frontend URL in production
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

# Mail Configuration (Gmail)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USER}
spring.mail.password=${EMAIL_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Razorpay Configuration
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}

# JWT Secret
jwt.secret=${JWT_SECRET:ecommerce-default-secret-key-that-is-long-enough-for-hmac-sha256}

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.org.springframework.data.mongodb=INFO
logging.level.com.mongodb=INFO
